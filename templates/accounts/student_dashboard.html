{% extends 'base/base.html' %}

{% block content %}

<div class="container-fluid">

    <h1 class="fw-bold mb-4">

        Student Dashboard

    </h1>

    <div class="row g-4 mb-4">

        <div class="col-md-4">

            <div class="dashboard-card">

                <h5 class="text-muted">

                    Attendance

                </h5>

                <h2 class="fw-bold text-success">

                    94%

                </h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="dashboard-card">

                <h5 class="text-muted">

                    Fees Due

                </h5>

                <h2 class="fw-bold text-danger">

                    ₹5,000

                </h2>

            </div>

        </div>

        <div class="col-md-4">

            <div class="dashboard-card">

                <h5 class="text-muted">

                    Average Marks

                </h5>

                <h2 class="fw-bold text-primary">

                    87%

                </h2>

            </div>

        </div>

    </div>

    <div class="row g-4">

        <div class="col-lg-8">

            <div class="table-container">

                <h4 class="fw-bold mb-4">

                    Recent Results

                </h4>

                <table class="table">

                    <thead>

                        <tr>

                            <th>

                                Subject

                            </th>

                            <th>

                                Marks

                            </th>

                            <th>

                                Grade

                            </th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr>

                            <td>

                                Mathematics

                            </td>

                            <td>

                                95

                            </td>

                            <td>

                                A+

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="col-lg-4">

            <div class="dashboard-card">

                <h4 class="fw-bold mb-4">

                    Quick Links

                </h4>

                <div class="d-grid gap-3">

                    <a
                        href="/attendance-list/"
                        class="btn btn-primary py-3"
                    >

                        Attendance

                    </a>

                    <a
                        href="/result-list/"
                        class="btn btn-success py-3"
                    >

                        Results

                    </a>

                    <a
                        href="/timetable-list/"
                        class="btn btn-warning py-3"
                    >

                        Timetable

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
