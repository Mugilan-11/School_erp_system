{% extends 'base/base.html' %}

{% block content %}

<div class="card dashboard-card">

    <div class="card-body text-center">

        <h3 class="mb-4">
            Delete Teacher
        </h3>

        <p>
            Are you sure you want to delete
            <strong>
                {{ teacher.full_name }}
            </strong>?
        </p>

        <form method="POST">

            {% csrf_token %}

            <button
                type="submit"
                class="btn btn-danger"
            >
                Delete
            </button>

            <a
                href="{% url 'teacher_list' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
