{% extends 'base/base.html' %}

{% block content %}

<div class="container-fluid">

    <h2 class="fw-bold mb-4">
        {{ class_name }} Fee Records
    </h2>

    <div class="card dashboard-card">

        <div class="card-body">

            <div class="table-responsive">

                <table class="table">

                    <thead>

                        <tr>

                            <th>Student</th>
                            <th>Amount</th>
                            <th>Status</th>
                            <th>Payment Date</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for fee in fees %}

                        <tr>

                            <td>
                                {{ fee.student.name }}
                            </td>

                            <td>
                                ₹{{ fee.amount }}
                            </td>

                            <td>
                                {{ fee.status }}
                            </td>

                            <td>
                                {{ fee.payment_date }}
                            </td>

                        </tr>

                        {% empty %}

                        <tr>

                            <td colspan="4" class="text-center">

                                No fee records found

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
