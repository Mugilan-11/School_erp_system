{% extends 'base/base.html' %}

{% block content %}

<div class="mb-4">

    <h2 class="fw-bold">

        Import Fees

    </h2>

    <p class="text-muted">

        Upload fee Excel sheet

    </p>

</div>

<div class="card dashboard-card">

    <div class="card-body p-4">

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}

            <div class="mb-4">

                <label class="form-label fw-semibold">

                    Upload Excel File

                </label>

                {{ form.excel_file }}

            </div>

            <button
                type="submit"
                class="btn btn-primary px-4 py-2 rounded-4"
            >

                <i class="bi bi-upload"></i>

                Import Fees

            </button>

        </form>

    </div>

</div>

{% endblock %}
