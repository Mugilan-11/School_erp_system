{% extends 'base/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">

            Login Portal

        </h1>

        <p class="text-muted">

            Select your role to continue

        </p>

    </div>

    <div class="row g-4 justify-content-center">

        <!-- STUDENT -->

        <div class="col-md-3">

            <div class="card dashboard-card p-4 text-center">

                <h3 class="fw-bold">

                    Student

                </h3>

                <a
                    href="{% url 'login' %}"
                    class="btn btn-primary mt-3"
                >

                    Login

                </a>

            </div>

        </div>

        <!-- TEACHER -->

        <div class="col-md-3">

            <div class="card dashboard-card p-4 text-center">

                <h3 class="fw-bold">

                    Teacher

                </h3>

                <a
                    href="{% url 'login' %}"
                    class="btn btn-success mt-3"
                >

                    Login

                </a>

            </div>

        </div>

        <!-- ADMIN -->

        <div class="col-md-3">

            <div class="card dashboard-card p-4 text-center">

                <h3 class="fw-bold">

                    Admin

                </h3>

                <a
                    href="{% url 'login_options' %}"
                    class="btn btn-dark mt-3"
                >

                    Login

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
