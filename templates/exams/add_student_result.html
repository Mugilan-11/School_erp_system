{% extends 'base/base.html' %}

{% block content %}

<div class="card dashboard-card p-4">

    <h2 class="fw-bold mb-4">
        Add Result
    </h2>

    <div class="alert alert-info">

        <strong>Student:</strong>
        {{ student.name }}

        <br>

        <strong>Student ID:</strong>
        {{ student.student_id }}

    </div>

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">

            <label class="form-label">
                Exam Name
            </label>

            <input
                type="text"
                name="exam_name"
                class="form-control"
                required
            >

        </div>

        <div class="row">

    {% for subject in subjects %}

    <div class="col-md-6 mb-3">

        <label>
            {{ subject.subject_name }}
        </label>

        <input
            type="number"
            name="{{ subject.subject_name }}"
            class="form-control"
            min="0"
            max="100"
            required
        >

    </div>

    {% endfor %}

</div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Save Result
        </button>

    </form>

</div>

{% endblock %}
