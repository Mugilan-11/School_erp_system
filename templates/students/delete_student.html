{% extends 'base/base.html' %}

{% block content %}

<div class="card dashboard-card p-4">

    <h2 class="text-danger">
        Delete Student
    </h2>

    <p class="mt-3">
        Are you sure you want to delete:
    </p>

    <h4>
        {{ student.name }}
    </h4>

    <p>
        Student ID:
        {{ student.student_id }}
    </p>

    <form method="post">

        {% csrf_token %}

        <button
            type="submit"
            class="btn btn-danger"
        >
            Delete Student
        </button>

        <a
            href="{% url 'student_list' %}"
            class="btn btn-secondary"
        >
            Cancel
        </a>

    </form>

</div>

{% endblock %}
