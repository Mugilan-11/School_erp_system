{% extends 'base/base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-header">

                <h3>
                    Add Timetable Entry
                </h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-success"
                    >
                        Save Timetable
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
